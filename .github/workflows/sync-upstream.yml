name: Sync upstream

# Merges NousResearch/hermes-agent into fork main hourly. Local installs run
# `hermes update`, which pulls FROM THIS FORK — so this workflow is what makes
# that a real update instead of a no-op.
# Never force-pushes: `git merge` only, and a conflict fails the job (scheduled
# failures notify the repo owner) rather than letting the fork drift silently.
# Hourly because upstream lands ~1000 commits/day; hourly keeps each merge ~40
# commits instead of ~1000, so a conflict stays small enough to resolve by hand.

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.SYNC_PAT }}
          fetch-depth: 0

      - name: Merge upstream/main into fork main
        run: |
          git config user.name "fork-sync-bot"
          git config user.email "fork-sync-bot@users.noreply.github.com"
          git remote add upstream https://github.com/NousResearch/hermes-agent.git
          git fetch --no-tags upstream main
          echo "upstream/main is $(git rev-list --count HEAD..upstream/main) commit(s) ahead"
          git merge --no-edit upstream/main
          git push origin HEAD:main
